repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: nf-core
  name: glpopgen
  description: A pipeline for common population genetics analyses using genotype likelihoods
    computed with ANGSD
  author: Ash Sendell-Price
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
  is_nfcore: true
