# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pcangsd_pca"
description: Estimate the genetic covariance matrix for principal component analysis from genotype likelihoods
keywords:
  - pcangsd
  - pca
  - covariance matrix
  - genotype likelihoods
  - population structure
  - genomics
tools:
  - "pcangsd":
      description: "Framework for analyzing low-depth next-generation sequencing (NGS)
        data in heterogeneous/structured populations using principal component analysis
        (PCA)."
      homepage: "https://github.com/Rosemeis/pcangsd"
      documentation: "https://github.com/Rosemeis/pcangsd"
      tool_dev_url: "https://github.com/Rosemeis/pcangsd"
      doi: "10.1534/genetics.118.301336"
      licence: ["GPL v3-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample set information
          e.g. [ id:'test', samples:'sample IDs' ]
    - beagle_file:
        type: file
        description: Beagle genotype likelihood file produced by ANGSD
        pattern: "*.beagle.gz"
        ontologies: []
output:
  covariance:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample set information
            e.g. [ id:'test', samples:'sample IDs' ]
      - "*.cov":
          type: file
          description: |
            Genetic covariance matrix (n samples x n samples), in the sample order
            of the Beagle file. Eigendecomposition gives the principal components.
          pattern: "*.cov"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample set information
            e.g. [ id:'test', samples:'sample IDs' ]
      - "*.log":
          type: file
          description: PCAngsd log file
          pattern: "*.log"
          ontologies: []
  versions_pcangsd:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "pcangsd":
          type: string
          description: The name of the tool
      - "pcangsd --version":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pcangsd:
          type: string
          description: The name of the tool
      - pcangsd --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ASendellPrice"
maintainers:
  - "@ASendellPrice"
